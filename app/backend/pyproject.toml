[project]
name = "homemind-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "pyjwt[crypto]==2.10.1",
  "mcp==1.12.4",
  "opencv-python-headless==5.0.0.93",
  "openai==3.52.0",
]

[project.optional-dependencies]
# Visão local (YOLO11 + pose + ByteTrack). Pesado (torch): fora do CI e do Docker por omissão.
# Instalar: uv sync --extra visao   (ultralytics é AGPL-3.0; ver features/visao/README.md)
# `lap`: associação do ByteTrack (o ultralytics tentaria instalá-lo com pip em runtime).
visao = ["ultralytics==8.4.215", "lap==0.5.14"]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.8.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"  # testes com o mesmo nome em features diferentes

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
# ultralytics depende de `opencv-python` (com GUI), que escreve no mesmo pacote `cv2` que o
# `opencv-python-headless` usado aqui. Anula-se aquele: só fica o headless (servidor sem GUI).
override-dependencies = ["opencv-python; sys_platform == 'never'"]
