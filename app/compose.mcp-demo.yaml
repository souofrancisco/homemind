# Demo completa (frontend + Authentik + câmara + motor + MCP real). Sobrepõe app/compose.yaml:
#   make mcp-demo        (equivale a docker compose -p homemind-mcpdemo -f compose.yaml -f este)
# O frontend não muda: continua a falar com o mesmo backend, agora com HOME_BACKEND=mcp.
services:
  backend:
    build:
      args:
        EXTRAS: visao  # YOLO11 + pose + ByteTrack só nesta imagem; `make dev` fica leve
    environment:
      VISAO_PASTA_MODELOS: /srv/modelos
      HOME_BACKEND: mcp
      MCP_TOKEN_PATH: /srv/mcp-auth/tokens.json
      MCP_WRITE_GRANT_PATH: /srv/data/mcp-write-grant.json
    volumes:
      - type: bind
        source: ./.mcp-auth
        target: /srv/mcp-auth
        bind:
          create_host_path: false
      # Pesos YOLO do host (app/backend/data/modelos, ignorados pelo Git): sem downloads no arranque.
      - type: bind
        source: ./backend/data/modelos
        target: /srv/modelos
        read_only: true
        bind:
          create_host_path: true
