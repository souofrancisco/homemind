name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:  # make check = lint + contrato OpenAPI→TS + build + segredos + compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.0", enable-cache: true, cache-dependency-glob: app/backend/uv.lock }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: make check
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make smoke
