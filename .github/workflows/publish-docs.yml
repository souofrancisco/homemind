name: Publish Docs

# Só quando mudam as entradas do site; merges de backend/frontend não reconstroem o Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/content/**"
      - "docs/mkdocs.yml"
      - "docs/requirements.txt"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - uses: actions/configure-pages@v6
      # Caminhos relativos a docs/mkdocs.yml. ../site é a raiz do repositório, onde o upload espera o site.
      - run: mkdocs build -f docs/mkdocs.yml --strict --site-dir ../site
        env:
          NO_MKDOCS_2_WARNING: "true"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
