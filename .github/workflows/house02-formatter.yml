name: HOUSE-02 temporary formatting
on:
  push:
    branches:
      - feat/house-02-memberships
permissions:
  contents: write
jobs:
  ruff-format-house-02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/house-02-memberships
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Format only HOUSE-02 files
        shell: bash
        run: |
          set -euo pipefail
          cd app/backend
          uv run ruff check --fix src/homemind/features/households/membership_flow.py src/homemind/features/households/router.py src/homemind/features/households/tests/test_membership_flow.py
          uv run ruff format src/homemind/features/households/membership_flow.py src/homemind/features/households/router.py src/homemind/features/households/tests/test_membership_flow.py
          cd ../..
          git diff -- app/backend/src/homemind/features/households/
      - name: Commit formatting to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "house-02-format-bot"
          git config user.email "house-02-format-bot@users.noreply.github.com"
          git add app/backend/src/homemind/features/households/membership_flow.py app/backend/src/homemind/features/households/router.py app/backend/src/homemind/features/households/tests/test_membership_flow.py
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(households): apply project ruff formatting (#85)"
            git push origin HEAD:feat/house-02-memberships
          fi
