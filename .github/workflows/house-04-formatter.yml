name: HOUSE-04 temporary formatter
on:
  push:
    branches: [feat/house-04-policies]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Ruff format only HOUSE-04 files
        run: |
          cd app/backend
          uv run ruff check --fix src/homemind/contracts/policy.py src/homemind/features/households/policies.py src/homemind/features/households/policy_store.py src/homemind/features/households/tests/test_policies.py
          uv run ruff format src/homemind/contracts/policy.py src/homemind/features/households/policies.py src/homemind/features/households/policy_store.py src/homemind/features/households/tests/test_policies.py
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/backend/src/homemind/contracts/policy.py app/backend/src/homemind/features/households/policies.py app/backend/src/homemind/features/households/policy_store.py app/backend/src/homemind/features/households/tests/test_policies.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(house-04): format policy files with Ruff"
          git push origin HEAD:refs/heads/feat/house-04-policies
